version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
      - node-modules:/workspace/node_modules
      - .output:/workspace/.output
      - .tanstack:/workspace/.tanstack
      - .wrangler:/workspace/.wrangler
    command: sleep infinity
    networks:
      - app-network
    env_file:
      - .env.example
    environment:
      - NODE_ENV=development
    ports:
      - "5173:5173"
      - "3000:3000"

  # Optional: Supabase local development database
  # Uncomment below if you need local Supabase
  # db:
  #   image: supabase/postgres:15.1.0.73
  #   restart: unless-stopped
  #   networks:
  #     - app-network
  #   environment:
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_USER: postgres
  #     POSTGRES_DB: postgres
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  node-modules:
  # postgres-data:

networks:
  app-network:
    driver: bridge
