name: Pre-Deployment Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_run:
    workflows: ["CI/CD Pipeline", "Security Audit", "Code Quality Checks", "Dependency Management"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gather-reports:
    name: Gather All Reports
    runs-on: ubuntu-latest
    outputs:
      ci-result: ${{ steps.check-ci.outputs.result }}
      security-result: ${{ steps.check-security.outputs.result }}
      quality-result: ${{ steps.check-quality.outputs.result }}
      deps-result: ${{ steps.check-deps.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check CI/CD status
        id: check-ci
        run: |
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&workflow=CI/CD%20Pipeline" | \
            jq -r '.workflow_runs[0].conclusion // "neutral"')
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Check Security Audit status
        id: check-security
        run: |
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&workflow=Security%20Audit" | \
            jq -r '.workflow_runs[0].conclusion // "neutral"')
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Check Code Quality status
        id: check-quality
        run: |
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&workflow=Code%20Quality%20Checks" | \
            jq -r '.workflow_runs[0].conclusion // "neutral"')
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Check Dependency Management status
        id: check-deps
        run: |
          RESULT=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&workflow=Dependency%20Management" | \
            jq -r '.workflow_runs[0].conclusion // "neutral"')
          echo "result=$RESULT" >> $GITHUB_OUTPUT

  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Check bundle size
        run: |
          # Check server bundle size
          SERVER_SIZE=$(stat -c%s "dist/server/server.js" 2>/dev/null || echo 0)
          echo "Server bundle size: $SERVER_SIZE bytes"
          if [ "$SERVER_SIZE" -gt 5242880 ]; then  # 5MB
            echo "::error::Server bundle too large ($SERVER_SIZE > 5MB)"
            exit 1
          fi

      - name: Verify required files
        run: |
          if [ ! -f "dist/server/server.js" ]; then
            echo "::error::Missing server bundle"
            exit 1
          fi
          if [ ! -d "dist/client/assets" ]; then
            echo "::error::Missing client assets"
            exit 1
          fi

  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest
    needs: build-validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI (if available)
        run: |
          echo "Performance check placeholder - integrate Lighthouse CI for production"
          echo "Consider adding: lhci lighthouse https://karacterhub.xyz"

  environment-validation:
    name: Environment Validation
    runs-on: ubuntu-latest
    steps:
      - name: Verify required environment variables
        run: |
          echo "Checking for required secrets..."
          
          # Check if secrets are set
          REQUIRED_SECRETS=(
            "CF_ACCOUNT_ID"
            "CF_API_TOKEN"
            "SUPABASE_URL"
            "SUPABASE_PUBLISHABLE_KEY"
            "SUPABASE_SERVICE_ROLE_KEY"
            "GEMINI_API_KEY"
            "MISTRAL_API_KEY"
          )
          
          for SECRET in "${REQUIRED_SECRETS[@]}"; do
            if [ -z "${!SECRET}" ]; then
              echo "::warning::Missing required secret: $SECRET"
            fi
          done

  pre-deploy-summary:
    name: Pre-Deployment Summary
    needs: [gather-reports, build-validation, performance-check, environment-validation]
    runs-on: ubuntu-latest
    outputs:
      can-deploy: ${{ steps.deploy-decision.outputs.can-deploy }}
    steps:
      - name: Generate summary
        run: |
          echo "# Pre-Deployment Validation Report" > pre-deploy-report.md
          echo "" >> pre-deploy-report.md
          echo "## Validation Date: $(date)" >> pre-deploy-report.md
          echo "## Commit: ${{ github.sha }}" >> pre-deploy-report.md
          echo "" >> pre-deploy-report.md
          echo "### Check Results:" >> pre-deploy-report.md
          echo "- CI/CD: ${{ needs.gather-reports.outputs.ci-result }}" >> pre-deploy-report.md
          echo "- Security: ${{ needs.gather-reports.outputs.security-result }}" >> pre-deploy-report.md
          echo "- Quality: ${{ needs.gather-reports.outputs.quality-result }}" >> pre-deploy-report.md
          echo "- Dependencies: ${{ needs.gather-reports.outputs.deps-result }}" >> pre-deploy-report.md
          echo "- Build: ${{ needs.build-validation.result }}" >> pre-deploy-report.md
          echo "- Performance: ${{ needs.performance-check.result }}" >> pre-deploy-report.md
          echo "- Environment: ${{ needs.environment-validation.result }}" >> pre-deploy-report.md

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-report
          path: pre-deploy-report.md

      - name: Deployment decision
        id: deploy-decision
        run: |
          ALL_PASSED=true
          
          for RESULT in \
            "${{ needs.gather-reports.outputs.ci-result }}" \
            "${{ needs.gather-reports.outputs.security-result }}" \
            "${{ needs.gather-reports.outputs.quality-result }}" \
            "${{ needs.gather-reports.outputs.deps-result }}" \
            "${{ needs.build-validation.result }}" \
            "${{ needs.performance-check.result }}" \
            "${{ needs.environment-validation.result }}"; do
            if [ "$RESULT" != "success" ]; then
              ALL_PASSED=false
              break
            fi
          done
          
          echo "can-deploy=$ALL_PASSED" >> $GITHUB_OUTPUT
          
          if [ "$ALL_PASSED" = true ]; then
            echo "✅ All pre-deployment checks passed! Ready for production."
          else
            echo "❌ Some checks failed. Review and fix before deployment."
            echo "::error::Pre-deployment validation failed. Review the report."
          fi

      - name: Fail if not ready for deployment
        if: steps.deploy-decision.outputs.can-deploy == 'false'
        run: exit 1

  notify:
    name: Notify Team
    needs: pre-deploy-summary
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send notification
        if: needs.pre-deploy-summary.result == 'success'
        run: |
          echo "✅ Pre-deployment validation passed for ${{ github.sha }}"
          echo "Ready for production deployment!"

      - name: Send failure notification
        if: needs.pre-deploy-summary.result == 'failure'
        run: |
          echo "❌ Pre-deployment validation failed for ${{ github.sha }}"
          echo "Review the pre-deploy report and fix issues before deployment."
