name: Code Quality Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run ESLint with fix (PR only)
        if: github.event_name == 'pull_request'
        run: npm run lint -- --fix

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Format code (PR only)
        if: github.event_name == 'pull_request'
        run: npm run format

  typecheck:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run typecheck

  code-review:
    name: Code Review (SonarCloud)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=karacter-web
            -Dsonar.projectKey=karacter-ai-buddy
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.*
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.language=ts
            -Dsonar.exclusions=**/node_modules/**,**/dist/**

  quality-gate:
    name: Quality Gate
    needs: [lint, format, typecheck]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify all checks passed
        if: |
          needs.lint.result == 'success' &&
          needs.format.result == 'success' &&
          needs.typecheck.result == 'success'
        run: echo "All code quality checks passed!"

      - name: Fail if quality checks failed
        if: |
          needs.lint.result == 'failure' ||
          needs.format.result == 'failure' ||
          needs.typecheck.result == 'failure'
        run: exit 1
