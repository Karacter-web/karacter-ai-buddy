[extend]
useDefault = true

[allowlist]
description = "Global Allowlist"
paths = [
  '''
  test/fixtures/
  node_modules/
  dist/
  .git/
  ''',
]
regexes = [
  '''
  # Generic API Key patterns that are too broad
  api[_-]?key\s*[=:]\s*['"]([a-zA-Z0-9_\-]{20,})['"]
  # Generic Secret patterns
  (secret|password|token|key)\s*[=:]\s*['"]([a-zA-Z0-9_\-]{20,})['"]
  ''',
]

[[rules]]
description = "Cloudflare API Token"
regex = '''(?i)(cf[_-]?api[_-]?token|cloudflare[_-]?api[_-]?token)['"\s]*[=:]\s*['"]([a-zA-Z0-9_\-]{40,})['"]'''
tags = ["cloudflare", "api", "token"]

[[rules]]
description = "Cloudflare Account ID"
regex = '''(?i)(cf[_-]?account[_-]?id|cloudflare[_-]?account[_-]?id)['"\s]*[=:]\s*['"]([a-z0-9\-]{36})['"]'''
tags = ["cloudflare", "account"]

[[rules]]
description = "Supabase URL"
regex = '''(?i)(supabase[_-]?url)['"\s]*[=:]\s*['"]https://[a-zA-Z0-9\-]+\.supabase\.co['"]'''
tags = ["supabase", "url"]

[[rules]]
description = "Supabase Anon/Publishable Key"
regex = '''(?i)(supabase[_-]?publishable[_-]?key|anon[_-]?key|sb_publishable)['"\s]*[=:]\s*['"](eyJ[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+)['"]'''
tags = ["supabase", "key"]

[[rules]]
description = "Supabase Service Role Key"
regex = '''(?i)(supabase[_-]?service[_-]?role[_-]?key|sb_secret)['"\s]*[=:]\s*['"](eyJ[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+)['"]'''
tags = ["supabase", "key", "service-role"]

[[rules]]
description = "Gemini API Key"
regex = '''(?i)(gemini[_-]?api[_-]?key|google[_-]?ai[_-]?key)['"\s]*[=:]\s*['"](AIza[0-9A-Za-z\-_]{35})['"]'''
tags = ["gemini", "google", "api", "key"]

[[rules]]
description = "Mistral API Key"
regex = '''(?i)(mistral[_-]?api[_-]?key)['"\s]*[=:]\s*['"]([a-zA-Z0-9\-_]{30,})['"]'''
tags = ["mistral", "api", "key"]

[[rules]]
description = "GitHub Token"
regex = '''(?i)(github[_-]?token|gh[_-]?token|ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|ghu_[a-zA-Z0-9]{36}|ghs_[a-zA-Z0-9]{36}|ghr_[a-zA-Z0-9]{36})'''
tags = ["github", "token"]

[[rules]]
description = "NPM Token"
regex = '''(?i)(npm[_-]?token)['"\s]*[=:]\s*['"](npm_[a-zA-Z0-9]{36})['"]'''
tags = ["npm", "token"]

[[rules]]
description = "Generic JWT Token"
regex = '''(?i)['"]eyJ[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+\.[a-zA-Z0-9\-_]+['"]'''
tags = ["jwt", "token"]

[[rules]]
description = "Generic Private Key"
regex = '''(?i)-----BEGIN\s+(?:RSA\s+)?PRIVATE\s+KEY-----'''
tags = ["private-key", "rsa"]

[[rules]]
description = "AWS Access Key ID"
regex = '''(?i)(aws[_-]?access[_-]?key[_-]?id)['"\s]*[=:]\s*['"](AKIA[0-9A-Z]{16})['"]'''
tags = ["aws", "access-key"]

[[rules]]
description = "AWS Secret Access Key"
regex = '''(?i)(aws[_-]?secret[_-]?access[_-]?key|aws[_-]?secret[_-]?key)['"\s]*[=:]\s*['"]([a-zA-Z0-9/+=]{40})['"]'''
tags = ["aws", "secret-key"]

[[rules]]
description = "Slack Webhook URL"
regex = '''(?i)(slack[_-]?webhook|webhook[_-]?url)['"\s]*[=:]\s*['"]https://hooks\.slack\.com/services/T[a-zA-Z0-9]+/B[a-zA-Z0-9]+/[a-zA-Z0-9]+['"]'''
tags = ["slack", "webhook"]

[[rules]]
description = "Stripe API Key"
regex = '''(?i)(stripe[_-]?api[_-]?key|stripe[_-]?secret[_-]?key)['"\s]*[=:]\s*['"](sk_live_[0-9a-zA-Z]{24}|sk_test_[0-9a-zA-Z]{24})['"]'''
tags = ["stripe", "api", "key"]

[[rules]]
description = "Heroku API Key"
regex = '''(?i)(heroku[_-]?api[_-]?key)['"\s]*[=:]\s*['"]([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})['"]'''
tags = ["heroku", "api", "key"]

[[rules]]
description = "Twilio API Key"
regex = '''(?i)(twilio[_-]?account[_-]?sid|twilio[_-]?auth[_-]?token)['"\s]*[=:]\s*['"](AC[a-f0-9]{32}|[a-f0-9]{32})['"]'''
tags = ["twilio", "api", "key"]

[[rules]]
description = "SendGrid API Key"
regex = '''(?i)(sendgrid[_-]?api[_-]?key)['"\s]*[=:]\s*['"](SG\.[a-zA-Z0-9\-_]{22}\.[a-zA-Z0-9\-_]{43})['"]'''
tags = ["sendgrid", "api", "key"]

[[rules]]
description = "Mailchimp API Key"
regex = '''(?i)(mailchimp[_-]?api[_-]?key)['"\s]*[=:]\s*['"]([a-f0-9]{32}-us[0-9]{1,2})['"]'''
tags = ["mailchimp", "api", "key"]

[[rules]]
description = "Generic Database Connection String"
regex = '''(?i)(database[_-]?url|mongodb[_-]?uri|postgres[_-]?url|mysql[_-]?url)['"\s]*[=:]\s*['"]mongodb:\/\/|postgres:\/\/|mysql:\/\/[^'"]+['"]'''
tags = ["database", "connection-string", "url"]
